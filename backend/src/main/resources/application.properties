spring.application.name=theseusoft-api
server.port=${SERVER_PORT:8080}
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/theseusoft?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
app.cors.allowed-origin=${CORS_ALLOWED_ORIGIN:http://localhost:5173}
# Use a Base64 secret of at least 32 bytes in production.
app.jwt.secret=${JWT_SECRET:VGhpc0lzQURldmVsb3BtZW50SldUU2VjcmV0S2V5Rm9yVGhlc2V1c29mdDIwMjY=}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
